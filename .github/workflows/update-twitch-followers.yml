name: Update social follower counts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-twitch-followers.yml"
      - "index.html"
      - "youtube-followers.json"
      - "twitch-followers.json"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: social-follower-counts
  cancel-in-progress: true

jobs:
  update-followers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch public Twitch follower count
        env:
          TWITCH_CHANNEL: frozican
        run: |
          set -euo pipefail
          COUNT="$(curl --fail --silent --show-error --retry 2 "https://decapi.me/twitch/followcount/$TWITCH_CHANNEL" | tr -d '\r\n')"
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "Follower-count provider returned an unexpected response."
            exit 1
          fi
          printf '{"platform":"twitch","channel":"frozican","followers":%s,"updatedAt":"%s"}\n' "$COUNT" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > twitch-followers.json

      - name: Ensure YouTube data file exists
        run: |
          if [[ ! -f youtube-followers.json ]]; then
            printf '{"platform":"youtube","channel":"frozicaaan","subscribers":null,"updatedAt":null}\\n' > youtube-followers.json
          fi

      - name: Fetch YouTube subscriber count
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${YOUTUBE_API_KEY:-}" ]]; then
            echo "::error::YOUTUBE_API_KEY secret is missing or empty. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          RESPONSE="$(curl --fail --silent --show-error --retry 2 --get "https://www.googleapis.com/youtube/v3/channels" --data-urlencode "part=statistics" --data-urlencode "forHandle=frozicaaan" --data-urlencode "key=$YOUTUBE_API_KEY")"
          COUNT="$(printf '%s' "$RESPONSE" | jq -er '.items[0].statistics.subscriberCount | numbers')"
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "YouTube API returned an unexpected subscriber count."
            exit 1
          fi
          printf '{"platform":"youtube","channel":"frozicaaan","subscribers":%s,"updatedAt":"%s"}\n' "$COUNT" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > youtube-followers.json

      - name: Commit updated counts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twitch-followers.json youtube-followers.json
          if git diff --cached --quiet; then
            echo "Follower counts have not changed."
            exit 0
          fi
          git commit -m "Update social follower counts"
          git push
